<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="rnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#rnGrad)" />

  <g filter="url(#rnShadow)">
    <!-- Roof with Chimney -->
    <path d="M120 236 L256 124 L392 236" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M340 190 V140 H372 V216" fill="#ffffff" />
    
    <!-- House body -->
    <path d="M164 228 V376 C164 388 174 398 186 398 H326 C338 398 348 388 348 376 V228" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Doorway -->
    <path d="M224 398 V304 C224 290 235 280 248 280 H264 C277 280 288 290 288 304 V398" fill="#ffffff" />
    
    <!-- Heart / Nest Accent above door -->
    <circle cx="256" cy="232" r="20" fill="#ffffff" />
  </g>
</svg>
